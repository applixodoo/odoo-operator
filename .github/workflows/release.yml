name: Release

# Tag-driven releases. Upstream drove this from release-please on master; this
# fork tracks upstream rather than cutting conventional-commit releases, so the
# trigger is an explicit `v*` tag instead.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Validate the tag shape before it reaches any shell or registry reference.
  # Carried over from upstream's resolve-ref: a value that passes this regex
  # contains no shell metacharacters, which is what makes the downstream
  # `${{ needs.resolve-ref.outputs.tag_name }}` interpolations safe.
  resolve-ref:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.pick.outputs.tag_name }}
    steps:
      - id: pick
        env:
          PUSHED_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$PUSHED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::invalid tag format: '$PUSHED_TAG' (expected vMAJOR.MINOR.PATCH[-prerelease], e.g. v2.7.0-droggol.1)"
            exit 1
          fi
          echo "tag_name=$PUSHED_TAG" >> "$GITHUB_OUTPUT"

  # Single-arch (linux/amd64) build, pushed by digest and then stitched into a
  # manifest list by `merge`. The two-step push-by-digest + imagetools pattern
  # is upstream's; it is kept even at one architecture so the published tag
  # always resolves through a manifest list, and so adding arm64 back is a
  # matrix entry rather than a rewrite.
  build-and-publish:
    needs: resolve-ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.tag_name }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"
        env:
          digest: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-linux-amd64
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [resolve-ref, build-and-publish]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.resolve-ref.outputs.tag_name }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      # The manifest-list digest is the only immutable handle on what was
      # published, and it is what a downstream deployment should pin. Surfaced
      # in the job summary so it does not have to be dug out of the logs.
      - name: Inspect image and report digest
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.resolve-ref.outputs.tag_name }}
        run: |
          docker buildx imagetools inspect "$IMAGE_REF"
          # The manifest-list digest is sha256 over the raw manifest bytes.
          DIGEST="sha256:$(docker buildx imagetools inspect "$IMAGE_REF" --raw | sha256sum | cut -d' ' -f1)"
          {
            echo "## Published image"
            echo
            echo '```'
            echo "$IMAGE_REF"
            echo "$IMAGE_REF@$DIGEST"
            echo '```'
            echo
            echo "**Manifest digest:** \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

  release-chart:
    runs-on: ubuntu-latest
    needs: [resolve-ref, merge]
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.tag_name }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Regenerate CRDs
        run: make helm-crds

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Release chart
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Log in to GHCR for OCI push
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Push chart to OCI registry
        run: |
          helm package charts/odoo-operator
          helm push odoo-operator-*.tgz oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/charts
